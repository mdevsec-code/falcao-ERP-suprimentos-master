# Nginx do Falcão ERP no VPS da Hostinger — um domínio só para o site e a API.
#
#   sudo cp deploy/nginx-falcao-erp.conf /etc/nginx/sites-available/falcao-erp
#   sudo sed -i 's/suprimentos.seudominio.com.br/SEU.DOMINIO/' /etc/nginx/sites-available/falcao-erp
#   sudo ln -s /etc/nginx/sites-available/falcao-erp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU.DOMINIO        # HTTPS grátis (Let's Encrypt), renova sozinho
#
# Antes: no painel da Hostinger (DNS), aponte um registro A do domínio para o IP do VPS.
#
# Cabeçalhos de segurança: o `add_header` de um `location` anula os do bloco de
# cima, por isso cada `location` do site repete os seus. A API manda os dela (helmet).

server {
    listen 80;
    listen [::]:80;
    server_name suprimentos.seudominio.com.br;

    # Não anuncia a versão do Nginx nas respostas e páginas de erro.
    server_tokens off;

    # Site (React) gerado por `npm run build`.
    root /var/www/falcao-erp/apps/web/dist;
    index index.html;

    # Uploads de até 50 MB (anexos, notas, catálogos) + folga do multipart.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API vai para o Node (só ele escuta na 3333, e só em localhost pelo firewall).
    # Os arquivos enviados saem por /api/v1/files com link temporário — não há /uploads público.
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Acrescenta o IP real no fim: com TRUST_PROXY=1 a API usa esse último valor,
        # então um X-Forwarded-For forjado pelo cliente não burla o limite de login.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envio de arquivo grande em conexão lenta.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Rotas do React (inclui /cotar, /cotacao e /enviar-catalogo que os fornecedores abrem).
    # O index nunca fica em cache: depois de um deploy o navegador já pega os arquivos novos.
    # CSP: só scripts do próprio site; fontes do Google Fonts; imagens do site, data: e blob:
    # (fotos redimensionadas antes do envio); API no mesmo domínio.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
