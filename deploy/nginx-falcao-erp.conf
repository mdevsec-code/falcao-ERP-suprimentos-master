# Nginx do Falcão ERP no VPS da Hostinger — um domínio só para o site e a API.
#
#   sudo cp deploy/nginx-falcao-erp.conf /etc/nginx/sites-available/falcao-erp
#   sudo sed -i 's/suprimentos.seudominio.com.br/SEU.DOMINIO/' /etc/nginx/sites-available/falcao-erp
#   sudo ln -s /etc/nginx/sites-available/falcao-erp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU.DOMINIO        # HTTPS grátis (Let's Encrypt), renova sozinho
#
# Antes: no painel da Hostinger (DNS), aponte um registro A do domínio para o IP do VPS.

server {
    listen 80;
    listen [::]:80;
    server_name suprimentos.seudominio.com.br;

    # Site (React) gerado por `npm run build`.
    root /var/www/falcao-erp/apps/web/dist;
    index index.html;

    # Uploads de até 50 MB (anexos, notas, catálogos) + folga do multipart.
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API e arquivos enviados vão para o Node (só ele escuta na 3333, e só em localhost pelo firewall).
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envio de arquivo grande em conexão lenta.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do React (inclui /cotar, /cotacao e /enviar-catalogo que os fornecedores abrem).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
