# Nginx de PRODUÇÃO (suprimentos.falcaoengenhariasz.com) — instalado por deploy/apply-nginx.sh.
# Mesmo conteúdo do modelo deploy/nginx-falcao-erp.conf, com o domínio, o certificado
# e as linhas do Certbot que já estão no servidor.
#
# Cabeçalhos de segurança: o `add_header` de um `location` anula os do bloco de
# cima, por isso cada `location` do site repete os seus. A API manda os dela (helmet).

server {
    server_name suprimentos.falcaoengenhariasz.com srv2065307.hstgr.cloud;

    # Não anuncia a versão do Nginx nas respostas e páginas de erro.
    server_tokens off;

    # Site (React) gerado por `npm run build`.
    root /var/www/falcao-erp/apps/web/dist;
    index index.html;

    # Uploads de até 50 MB (anexos, notas, catálogos) + folga do multipart.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API vai para o Node (só ele escuta na 3333, e só em 127.0.0.1).
    # Os arquivos enviados saem por /api/v1/files com link temporário — não há /uploads público.
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Acrescenta o IP real no fim: com TRUST_PROXY=1 a API usa esse último valor,
        # então um X-Forwarded-For forjado pelo cliente não burla o limite de login.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envio de arquivo grande em conexão lenta.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Rotas do React (inclui /cotar, /cotacao e /enviar-catalogo que os fornecedores abrem).
    # O index nunca fica em cache: depois de um deploy o navegador já pega os arquivos novos.
    # CSP testada com o build real (login, telas, fotos por link temporário e PDF).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv2065307.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv2065307.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = suprimentos.falcaoengenhariasz.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = srv2065307.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name suprimentos.falcaoengenhariasz.com srv2065307.hstgr.cloud;
    return 404; # managed by Certbot
}
